# gitleaks configuration: the default rules, plus the false positives this tree is known to hold. The commit-safety
# check in .github/workflows/pr.yml scans each pull request's commits with it. Keep each allowlist entry narrow (one
# rule, one line shape) and say why it is not a secret.
title = "billboard"

[extend]
useDefault = true

# No path is allowlisted.

# services/src/tests/refetchStaleBills.test.ts: a stop-condition table whose third column is a reason code.
[[allowlists]]
description = "the congress_key_errors stop reason and its metric text"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''congress_key_errors", "CongressApi429=\d+''']
