name: Deploy

# The production pipeline (docs/DEPLOYING.md). Every run verifies and builds the Lambda release for its own commit.
# A push to main stops there. A manual run on main also reaches production, after approval:
#   mode=diff   = publish the release and show the CloudFormation diff
#   mode=deploy = publish the release (unless release_id names an existing one) and deploy it
#
# All AWS work is in one job, `deploy`, in the `production` environment: GitHub holds it until one of the project's
# maintainers approves the run, and the environment lets only main in. That job alone may request an OIDC token, and
# the two AWS roles (infra/lib/stacks/github-oidc.ts) trust only this file on this repository's main branch, in the
# production environment. The job first
# publishes the release with the services release role, clears those credentials, and only then installs packages and
# takes the infra deploy role. A diff run narrows that role's session to the reads it makes (inline session policy
# below). The account ID comes from the environment's AWS_ACCOUNT_ID secret, so GitHub masks it in the logs.
#
# infra/test/deploy-workflow.test.ts scans this file for CLI calls and checks the roles grant each one, and that
# the diff session policy covers every call a diff run makes. S3 copies here must be downloads; uploads live
# in scripts/ci/publish-release.sh. Never write the CLI's name followed by two words anywhere in this file,
# comments included.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
      - '.github/workflows/pr.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff = publish the release and show the CloudFormation diff; deploy = deploy to production'
        type: choice
        options: [diff, deploy]
        default: diff
      release_id:
        description: 'Optional: use this existing release (releases/<id>/manifest.json) instead of the one built here, for a rollback.'
        type: string
        default: ''
      allow_replacements:
        description: 'Optional, for an intentional replacement only: <Stack>/<LogicalId> entries (comma-separated) the deploy guard may let through. Back up or move the data first.'
        type: string
        default: ''

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ARTIFACTS_BUCKET: billboard-lambda-artifacts

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      release_id: ${{ steps.plan.outputs.release_id }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          # Only a manual run on main reaches production; a push only verifies and builds.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then mode="$INPUT_MODE"
          else mode=off; fi
          case "$mode" in off|diff|deploy) ;; *) echo "::error::mode must be diff or deploy, not '$mode'"; exit 1;; esac
          release_id="${INPUT_RELEASE_ID:-}"
          if [ -n "$release_id" ] && [[ ! "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::release_id '$release_id' is not a valid release id"; exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Deploy mode: $mode" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$release_id" ]; then echo "Existing release: $release_id" >> "$GITHUB_STEP_SUMMARY"; fi

  build:
    # No cloud credentials in this job.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Turns off two git advice messages for the repository the checkout creates: the initial branch name hint of
        # its `git init`, and the detached HEAD note of a pull request's merge commit. Only this step's git sees them.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            services/package-lock.json
            infra/package-lock.json
      - run: npm run setup
      - name: Verify, build the release and strict-synth it
        run: npm run verify
      - name: The release belongs to this commit
        run: test "$(jq -r .git.commitSha .release/manifest.json)" = "$GITHUB_SHA"
      - if: needs.plan.outputs.mode != 'off' && needs.plan.outputs.release_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-release
          path: |
            .release/zips/
            .release/manifest.json
            .release/release-id
            .release/version
          if-no-files-found: error
          retention-days: 7

  deploy:
    # The only job with AWS access. It waits in the production environment until one of the project's maintainers
    # approves it, and only one such job runs at a time: queue, never cancel, because a cancelled run can leave
    # CloudFormation or CodeDeploy mid-flight. Push runs never reach it, so they never wait for this lock.
    needs: [plan, build]
    if: needs.plan.outputs.mode != 'off' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: billboard-production
      cancel-in-progress: false
    # CON-08: CodeDeploy shifts API handlers 10% for 10 minutes, then 100% (workers all at once), and all
    # deployments run in parallel, so they finish in about 11 minutes; the wait allows 45. The rest leaves
    # room for the upload, npm ci, synth, a 15-stack diff and cdk deploy. GitHub's hard limit is 360.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      EXISTING_RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      BILLBOARD_STRICT_RELEASE: 'true'
      # The real account, in place of the documentation example in infra/lib/config/deployment-identity.ts.
      CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: us-east-1
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Turns off two git advice messages for the repository the checkout creates: the initial branch name hint of
        # its `git init`, and the detached HEAD note of a pull request's merge commit. Only this step's git sees them.
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: advice.detachedHead
          GIT_CONFIG_VALUE_1: 'false'
        with:
          persist-credentials: false
      # 1. Publish the release this run built, before any package is installed. No npm and no Node while these
      #    credentials are live.
      - name: Download the release this run built
        if: env.EXISTING_RELEASE_ID == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-release
          path: ${{ runner.temp }}/release
      - name: The release belongs to this commit
        if: env.EXISTING_RELEASE_ID == ''
        run: test "$(jq -r .git.commitSha "$RUNNER_TEMP/release/manifest.json")" = "$GITHUB_SHA"
      # Lists, reads and writes the artifacts bucket, nothing else; 1-hour sessions at most.
      # The repository's Actions policy allows GitHub's own actions and, of the others, only this exact commit of
      # configure-aws-credentials (all three steps that use it). With any other commit GitHub does not start this
      # workflow at all, so update the policy first; infra/test/workflows.test.ts holds the same list.
      - name: AWS credentials for the release upload
        if: env.EXISTING_RELEASE_ID == ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubServicesReleaseRole
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - id: publish
        name: Publish zips, then the manifest
        if: env.EXISTING_RELEASE_ID == ''
        working-directory: .
        run: scripts/ci/publish-release.sh "$RUNNER_TEMP/release"
      # 2. Clear the upload credentials before npm ci runs any package's install script.
      - name: Clear the upload credentials
        if: env.EXISTING_RELEASE_ID == ''
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do echo "$name=" >> "$GITHUB_ENV"; done
      - name: The release to deploy
        env:
          PUBLISHED_RELEASE_ID: ${{ steps.publish.outputs.release_id }}
        run: |
          set -euo pipefail
          release_id="${PUBLISHED_RELEASE_ID:-$EXISTING_RELEASE_ID}"
          test -n "$release_id"
          echo "BILLBOARD_RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          if [ -n "$PUBLISHED_RELEASE_ID" ]; then echo "BUILT_THIS_RUN=true" >> "$GITHUB_ENV"; else echo "BUILT_THIS_RUN=false" >> "$GITHUB_ENV"; fi
          echo "Release: $release_id" >> "$GITHUB_STEP_SUMMARY"
      # 3. Install, then the infra deploy role: synth, diff and the deploy guard in both modes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: No AWS credentials while packages install
        run: test -z "${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}${AWS_SESSION_TOKEN:-}"
      - run: npm ci
      # GitHubInfraDeployRole reaches CloudFormation and the CDK assets bucket only through the CDK bootstrap
      # roles. A diff run keeps, of its policy, the release manifest and zip downloads, the alias reads and the
      # three bootstrap roles a change-set diff assumes: it cannot write an alias pin or start a CodeDeploy
      # deployment. The bootstrap deploy role can still change stacks, so this is not a read-only diff.
      - name: AWS credentials for a diff (no alias pin or CodeDeploy writes)
        if: env.MODE == 'diff'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubInfraDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
            {"Sid":"CdkDiffBootstrapRoles","Effect":"Allow","Action":"sts:AssumeRole","Resource":[
            "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cdk-hnb659fds-deploy-role-${{ secrets.AWS_ACCOUNT_ID }}-us-east-1",
            "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cdk-hnb659fds-file-publishing-role-${{ secrets.AWS_ACCOUNT_ID }}-us-east-1",
            "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cdk-hnb659fds-lookup-role-${{ secrets.AWS_ACCOUNT_ID }}-us-east-1"]},
            {"Sid":"DownloadReleaseManifest","Effect":"Allow","Action":"s3:GetObject",
            "Resource":"arn:aws:s3:::billboard-lambda-artifacts/releases/*"},
            {"Sid":"DownloadReleaseZips","Effect":"Allow","Action":"s3:GetObject",
            "Resource":"arn:aws:s3:::billboard-lambda-artifacts/artifacts/*"},
            {"Sid":"ReadProdAliases","Effect":"Allow","Action":"lambda:GetAlias",
            "Resource":"arn:aws:lambda:us-east-1:${{ secrets.AWS_ACCOUNT_ID }}:function:*"}]}
      - name: AWS credentials for a deploy
        if: env.MODE == 'deploy'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubInfraDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400
          mask-aws-account-id: true
      - name: Verify the release manifest exists
        run: |
          key="releases/${BILLBOARD_RELEASE_ID}/manifest.json"
          if ! error="$(aws s3api head-object --bucket "$ARTIFACTS_BUCKET" --key "$key" 2>&1 >/dev/null)"; then
            echo "$error" >&2
            echo "::error title=Release manifest missing::s3://$ARTIFACTS_BUCKET/$key is missing or unreadable (a 403 also means missing: the deploy role cannot list the bucket). Run this workflow without release_id to build and publish a fresh release."
            exit 1
          fi
      - name: Download the release manifest
        run: |
          manifest="$RUNNER_TEMP/release-manifest.json"
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/releases/${BILLBOARD_RELEASE_ID}/manifest.json" "$manifest"
          if [ "$BUILT_THIS_RUN" = "true" ]; then test "$(jq -r .git.commitSha "$manifest")" = "$GITHUB_SHA"; fi
          echo "BILLBOARD_RELEASE_MANIFEST_FILE=$manifest" >> "$GITHUB_ENV"
      # CloudFormation deploys whatever object sits at each manifest key, and a run given release_id deploys zips an
      # earlier run uploaded. Each key holds its zip's SHA-256 (artifacts/<logicalName>/<sha256>.zip, which synth
      # also requires), so in such a run this downloads every zip to the runner and fails the run, before anything
      # is deployed, on each missing zip or hash that differs from the manifest's. A run that builds its release
      # skips it: publish-release.sh compared each zip with the manifest just before step 1 uploaded it, and the run
      # then never needs this role's artifacts/ read, so it can always deploy a change to that grant. A diff run
      # given release_id runs the check and deploys nothing.
      # Limits: it trusts the manifest, so a manifest rewritten together with its zips passes; and it reads each key
      # once, here, while the Lambda updates of cdk deploy fetch the key again later with no object version pinned,
      # so a write to the key in between is not caught. Both rest on only the release upload of an approved run
      # writing artifacts/, which is why uploads happen only in step 1 of this job.
      - name: Check every release zip against the manifest
        if: env.EXISTING_RELEASE_ID != ''
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-zip-check"
          mkdir -p "$dir"
          # One JSON document whose artifacts are a non-empty array, each naming its zip with non-empty strings. Only
          # the last field below may then be empty: bash's read merges empty fields and would shift the ones after.
          if ! jq -r -s '
            if length != 1 then error("it is not one JSON document") else .[0] end
            | .artifacts
            | if type == "array" and length > 0 then .[] else error("its artifacts are not a non-empty array") end
            | if type == "object" and ([.logicalName, .s3Key, .sha256] | all(type == "string" and length > 0))
              then [.logicalName, .s3Key, .sha256, (.s3ObjectVersion // "" | tostring)] | @tsv
              else error("an artifact has no logicalName, s3Key or sha256 string") end
          ' "$BILLBOARD_RELEASE_MANIFEST_FILE" > "$dir/artifacts.tsv" 2> "$dir/jq-error.txt"; then
            echo "::error title=Release zip check::the manifest of release ${BILLBOARD_RELEASE_ID} cannot be checked: $(tr '\n' ' ' < "$dir/jq-error.txt")"
            exit 1
          fi
          total=0
          failed=0
          failed_names=""
          fail() {
            echo "::error title=$1::${name}: $2"
            failed=$((failed + 1))
            failed_names="${failed_names} ${name}"
          }
          while IFS=$'\t' read -r name s3_key sum version; do
            total=$((total + 1))
            if [[ ! "$sum" =~ ^[a-f0-9]{64}$ ]] || [ "$s3_key" != "artifacts/${name}/${sum}.zip" ]; then
              fail "Release zip key" "the manifest key '${s3_key}' is not artifacts/${name}/<its sha256>.zip, so its zip cannot be checked."
              continue
            fi
            if [ -n "$version" ]; then
              fail "Release zip version" "the manifest pins S3 object version '${version}', and this check reads only the current object."
              continue
            fi
            zip="$dir/${sum}.zip"
            if ! error="$(aws s3 cp "s3://${ARTIFACTS_BUCKET}/artifacts/${name}/${sum}.zip" "$zip" --only-show-errors 2>&1 < /dev/null)"; then
              echo "$error" >&2
              fail "Release zip missing" "s3://${ARTIFACTS_BUCKET}/artifacts/${name}/${sum}.zip is missing or unreadable (a 403 also means missing: the deploy role cannot list the bucket)."
              continue
            fi
            actual="$(sha256sum "$zip" | cut -d ' ' -f 1)"
            rm -f "$zip"
            if [ "$actual" != "$sum" ]; then
              fail "Release zip changed" "s3://${ARTIFACTS_BUCKET}/artifacts/${name}/${sum}.zip has SHA-256 ${actual}, not the manifest's ${sum}: something replaced it after the release was published."
            fi
          done < "$dir/artifacts.tsv"
          if [ "$failed" -gt 0 ]; then
            echo "Release zip check: ${failed} of ${total} zips failed:${failed_names}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Release zip check::${failed} of ${total} zips of release ${BILLBOARD_RELEASE_ID} failed the check (errors above). Nothing has been deployed. docs/DEPLOYING.md says what each error means; to roll back meanwhile, revert the change on main, which builds and publishes a fresh release."
            exit 1
          fi
          echo "Release zips checked against the manifest: $total" >> "$GITHUB_STEP_SUMMARY"
      - name: Synthesize (strict release; website/ and contracts/ come from this checkout)
        env:
          # Unset reserves 1 poller execution; "off" drops it. See infra/lib/config/congress-integration-service-constants.ts.
          BILLS_API_POLLER_RESERVED_CONCURRENCY: ${{ vars.BILLS_API_POLLER_RESERVED_CONCURRENCY }}
        run: npx cdk synth --quiet
      - name: Diff against production
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # No stack named: diff takes every top-level stack (it has no --all option), and the deploy guard below
          # fails the run if any stack of cdk.out has no section in this output.
          npx cdk diff --app cdk.out --no-color 2>&1 | tee "$RUNNER_TEMP/cdk-diff.txt"
          # Build the summary from files, not a grep | head pipe: under pipefail a large diff makes
          # head exit early, grep dies of SIGPIPE, and the step would fail after a successful diff.
          # The account ID is masked in the log, and taken out of the summary here.
          grep -E '^(Stack |\[[-+~]\]|There were no differences)' "$RUNNER_TEMP/cdk-diff.txt" > "$RUNNER_TEMP/cdk-diff-summary.txt" || true
          { echo '```'; sed -n '1,300p' "$RUNNER_TEMP/cdk-diff-summary.txt" | sed "s/${ACCOUNT_ID:?}/***/g"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Fails the run, in diff and deploy mode, when the diff would replace or delete a Cognito user pool or client,
      # a DynamoDB table, an S3 bucket, a Secrets Manager secret or the UserFeedback stream mapping, or would change
      # the poller cursor parameter. SQS queue and mapping replacements are warnings. It also fails when a stack of
      # cdk.out has no section in the diff (a diff cut short). Nothing has been written to production yet: the alias
      # pins and cdk deploy come after. docs/DEPLOYING.md has the details and the override.
      - name: Block replacing or deleting stateful resources
        env:
          DEPLOY_GUARD_ALLOW: ${{ inputs.allow_replacements }}
        run: npm run release:check-deploy-guard -- --diff "$RUNNER_TEMP/cdk-diff.txt" --templates cdk.out
      - name: Show the alias pins a deploy would write
        if: env.MODE == 'diff'
        run: npm run release:sync-prod-alias-versions -- --templates cdk.out --dry-run
      # 4. Deploy mode only: the alias pins, cdk deploy and CodeDeploy.
      - name: Sync live Lambda alias version pins
        if: env.MODE == 'deploy'
        run: npm run release:sync-prod-alias-versions -- --templates cdk.out
      - name: Deploy all stacks
        if: env.MODE == 'deploy'
        run: npx cdk deploy --app cdk.out --all --require-approval never --outputs-file cdk-outputs.json
      - name: Move Lambda prod aliases with CodeDeploy
        if: env.MODE == 'deploy'
        run: npm run release:deploy-lambdas -- --outputs cdk-outputs.json --timeout-minutes 45
